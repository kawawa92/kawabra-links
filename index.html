<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="三国志バトル専用ブラウザへのボタン登録ページ">
  <title>ボタン登録一覧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">KAWABRA LINKS</p>
      <h1>ボタン登録一覧</h1>
      <p class="intro">登録先を選択して「登録する」を押してください。ブラウザアプリが起動し、確認画面が表示されます。</p>
    </header>

    <section id="button-list" class="button-list" aria-label="登録するボタンの一覧"></section>

    <aside class="notice" aria-label="注意事項">
      ブラウザアプリがインストールされていない端末では登録できません。
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
